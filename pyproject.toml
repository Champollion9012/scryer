[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scryer"
version = "0.2.0"
description = "Multi-chain EVM contract security research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Scryer contributors" }]
keywords = ["evm", "solidity", "security", "audit", "blockchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Runtime deps mirror requirements.txt — keep in sync.
dependencies = [
    "httpx>=0.27,<1.0",
    "httpx-socks[asyncio]>=0.10",
    "orjson>=3.10",
    "web3>=6.20",
    "cbor2>=5.6",
    "eth-abi>=5.1",
    "python-dotenv>=1.0",
    "flask>=3.0",
]

[project.optional-dependencies]
similarity = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "torch>=2.2",
]
bigquery = [
    "google-cloud-bigquery>=3.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
scryer-download = "download_contract:main"
scryer-crawl = "contract_crawler:main"
scryer-discover = "rpc_contract_discovery:main"
scryer-audit = "audit_contracts:main"
scryer-bounty = "bounty_pipeline:main"
scryer-similarity = "similarity_cli:main"
scryer-web = "web:main"

[project.urls]
Homepage = "https://github.com/your-org/scryer"
Issues = "https://github.com/your-org/scryer/issues"

# ---------------------------------------------------------------------------
# setuptools — flat layout (modules at repo root)
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = [
    "audit_contracts",
    "bounty_pipeline",
    "cache",
    "contract_crawler",
    "contract_registry",
    "data_sources",
    "decompilers",
    "download_contract",
    "llm_providers",
    "report_renderer",
    "rpc_contract_discovery",
    "scanners",
    "scryer_config",
    "scryer_http",
    "scryer_logging",
    "similarity",
    "similarity_cli",
    "web",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "lib",
    "out",
    "cache",
    "sources",
    "audit_reports",
    "runs",
    "decompiled",
    ".similarity_db",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "B008",  # function-call-in-default-argument
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/python/**" = ["B011", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
strict_optional = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "lib/",
    "out/",
    "cache/",
    "sources/",
    "audit_reports/",
    "runs/",
    "decompiled/",
    "tests/python/",
]

# Modules with full type discipline — keep this list short and grow over time.
[[tool.mypy.overrides]]
module = [
    "scryer_config",
    "scryer_logging",
    "scryer_http",
    "cache",
    "scanners",
    "report_renderer",
    "bounty_pipeline",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "network: tests that require network access (skipped by default in CI)",
    "slow: tests that take more than a few seconds",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "lib/*",
    "out/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
